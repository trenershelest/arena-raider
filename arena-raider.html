  // ---------- map ----------
  const MAP_W = 26, MAP_H = 26;
  function buildMap(mapSeed) {
    const m = [];
    for (let y = 0; y < MAP_H; y++) {
      const row = [];
      for (let x = 0; x < MAP_W; x++) {
        let zone = (x < MAP_W / 2) ? ((y < MAP_H / 2) ? 1 : 2) : ((y < MAP_H / 2) ? 3 : 4);
        if (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1) row.push(zone);
        else row.push(0);
      }
      m.push(row);
    }
    // scattered cover pillars, colored by zone, avoiding center spawn area
    let seed = mapSeed || 42;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % 10000) / 10000; }
    const cx = MAP_W / 2, cy = MAP_H / 2;
    for (let i = 0; i < 42; i++) {
      const bx = 2 + Math.floor(rnd() * (MAP_W - 6));
      const by = 2 + Math.floor(rnd() * (MAP_H - 6));
      if (Math.hypot(bx - cx, by - cy) < 3) continue;
      const zone = (bx < MAP_W / 2) ? ((by < MAP_H / 2) ? 1 : 2) : ((by < MAP_H / 2) ? 3 : 4);
      const w = 1 + (rnd() < 0.4 ? 1 : 0), h = 1 + (rnd() < 0.4 ? 1 : 0);
      for (let yy = by; yy < by + h && yy < MAP_H - 1; yy++) {
        for (let xx = bx; xx < bx + w && xx < MAP_W - 1; xx++) {
          if (Math.hypot(xx - cx, yy - cy) > 2.5) m[yy][xx] = zone;
        }
      }
    }
    return m;
  }
  let MAP = buildMap(42);

  function hashN(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;

      case 'industrial': return shade * (Math.floor((hx + hy) * 3) % 2 === 0 ? 1 : 0.8);
      case 'cave': return shade * (0.82 + 0.18 * Math.sin(coord * 26));
      case 'ice': return shade * (hashN(Math.floor(hx * 37) + Math.floor(hy * 53)) > 0.94 ? 1.6 : 1);
      case 'desert': return shade * (0.86 + 0.14 * Math.sin(coord * 9));
      case 'swamp': return shade * (0.78 + 0.22 * hashN(Math.floor(coord * 14)));
      case 'volcanic': return shade * (hashN(Math.floor(coord * 40)) > 0.9 ? 1.5 : 0.88);
      case 'neon': return shade * (Math.floor(coord * 10) % 2 === 0 ? 1.15 : 0.72);
      case 'alienhive': return shade * (0.83 + 0.17 * Math.sin(coord * 16 + t));
      case 'crystal': return shade * (Math.floor(coord * 7) % 2 === 0 ? 1.1 : 0.82);
      case 'orbital': return shade * (Math.floor(coord * 12) % 2 === 0 ? 1 : 0.88);
      default: return shade;
    }
  }

  function renderScene() {
    const stage = STAGES[stageIndex];
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, HALF_H);
    sky.addColorStop(0, stage.sky[0]); sky.addColorStop(1, stage.sky[1]);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, RW, HALF_H);
    // pseudo-3d panorama horizon
    renderPanorama(stage);
    // floor
    const floor = ctx.createLinearGradient(0, HALF_H, 0, RH);
    floor.addColorStop(0, stage.floor[0]); floor.addColorStop(1, stage.floor[1]);
    ctx.fillStyle = floor; ctx.fillRect(0, HALF_H, RW, HALF_H);

    const bTime = performance.now() / 600;
    for (let i = 0; i < NUM_RAYS; i++) {
      const rayAngle = player.angle - FOV / 2 + (i / NUM_RAYS) * FOV;
      const r = castRay(rayAngle);
      const corrected = r.dist * Math.cos(rayAngle - player.angle);
      lastWallDist[i] = corrected;
      const wallH = Math.min(RH, (RH / corrected) * 0.9);
      const colors = stage.walls[r.wt] || stage.walls[1];
      let shade = Math.max(0.12, Math.min(1, 1 - corrected / MAX_DEPTH));
      shade = biomeWallShade(stage.biome, r.side, r.hx, r.hy, shade, bTime);
      const base = r.side ? colors.lo : colors.hi;
      const num = parseInt(base.slice(1), 16);
      let rr = (num >> 16), gg = ((num >> 8) & 0xff), bb = (num & 0xff);
      rr = Math.round(Math.max(0, Math.min(255, rr * shade))); gg = Math.round(Math.max(0, Math.min(255, gg * shade))); bb = Math.round(Math.max(0, Math.min(255, bb * shade)));
      ctx.fillStyle = 'rgb(' + rr + ',' + gg + ',' + bb + ')';
      ctx.fillRect(i, HALF_H - wallH / 2, 1, wallH);
    }
  }

  function shadeHex(hex, percent) {
    const num = parseInt(hex.slice(1), 16);
    let r = (num >> 16) + percent, g = ((num >> 8) & 0xff) + percent, b = (num & 0xff) + percent;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
  }

  function drawHumanoidSprite(screenX, topY, size, bodyColor, headColor, walkPhase, flash, alpha, species) {
    // proportion/posture tweaks per species (silhouette-level differentiation)
    let hunchX = 0, hunchY = 0, limbMul = 1, showClaws = false;
    if (species === 'ghoul') { hunchX = size * 0.07; hunchY = size * 0.06; limbMul = 0.72; }
    if (species === 'alien' || species === 'predator') showClaws = true;
    const cx = screenX + hunchX, cy = topY + hunchY;
    ctx.save();
    ctx.globalAlpha = alpha;
    const legSwing = Math.sin(walkPhase) * size * 0.14;
    ctx.fillStyle = flash ? '#ffffff' : shadeHex(bodyColor, -30);
    const legTopY = cy + size * 0.66;
    const legW = size * 0.11 * limbMul;
    ctx.fillRect(cx - size * 0.15, legTopY + Math.max(0, legSwing), legW, size * 0.34 - Math.max(0, legSwing));
    ctx.fillRect(cx + size * 0.04, legTopY + Math.max(0, -legSwing), legW, size * 0.34 - Math.max(0, -legSwing));
    const armSwing = Math.sin(walkPhase + Math.PI) * size * 0.1;
    ctx.fillStyle = flash ? '#ffffff' : shadeHex(bodyColor, -15);
    const armW = size * 0.08 * limbMul;
    ctx.fillRect(cx - size * 0.27, cy + size * 0.34 + armSwing, armW, size * 0.3);
    ctx.fillRect(cx + size * 0.19, cy + size * 0.34 - armSwing, armW, size * 0.3);
    if (showClaws) {
      ctx.fillStyle = flash ? '#ffffff' : shadeHex(bodyColor, -40);
      const clawY1 = cy + size * 0.34 + armSwing + size * 0.3, clawY2 = cy + size * 0.34 - armSwing + size * 0.3;
      ctx.beginPath(); ctx.moveTo(cx - size * 0.27, clawY1); ctx.lineTo(cx - size * 0.31, clawY1 + size * 0.08); ctx.lineTo(cx - size * 0.23, clawY1 + size * 0.04); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + size * 0.27, clawY2); ctx.lineTo(cx + size * 0.31, clawY2 + size * 0.08); ctx.lineTo(cx + size * 0.23, clawY2 + size * 0.04); ctx.fill();
    }
    ctx.fillStyle = flash ? '#ffffff' : bodyColor;
    roundRect(cx - size * 0.19, cy + size * 0.3, size * 0.38, size * 0.4, size * 0.07); ctx.fill();
    if (species === 'ghoul') {
      // tattered notches along torso edge
      ctx.fillStyle = flash ? '#ffffff' : shadeHex(bodyColor, -35);
      for (let i = 0; i < 3; i++) {
        const ny = cy + size * 0.42 + i * size * 0.09;
        ctx.beginPath(); ctx.moveTo(cx - size * 0.19, ny); ctx.lineTo(cx - size * 0.24, ny + size * 0.04); ctx.lineTo(cx - size * 0.19, ny + size * 0.06); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx + size * 0.19, ny); ctx.lineTo(cx + size * 0.24, ny + size * 0.04); ctx.lineTo(cx + size * 0.19, ny + size * 0.06); ctx.fill();
      }
    }
    if (species === 'cop') {
      // white sash across torso + baton
      ctx.fillStyle = flash ? '#ffffff' : '#eeeeee';
      ctx.fillRect(cx - size * 0.19, cy + size * 0.46, size * 0.38, size * 0.05);
      ctx.fillStyle = flash ? '#ffffff' : '#dddddd';
      ctx.fillRect(cx + size * 0.29, cy + size * 0.5, size * 0.05, size * 0.22);
    }
    if (species === 'alien') {
      // elongated alien head with antennae + single glowing eye + mandibles
      ctx.lineWidth = Math.max(1, size * 0.02); ctx.strokeStyle = flash ? '#ffffff' : shadeHex(bodyColor, -20);
      ctx.beginPath(); ctx.moveTo(cx - size * 0.05, cy + size * 0.08); ctx.quadraticCurveTo(cx - size * 0.22, cy - size * 0.08, cx - size * 0.18, cy - size * 0.24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + size * 0.05, cy + size * 0.08); ctx.quadraticCurveTo(cx + size * 0.22, cy - size * 0.08, cx + size * 0.18, cy - size * 0.24); ctx.stroke();
      ctx.fillStyle = flash ? '#ffffff' : headColor;
      ctx.save(); ctx.translate(cx, cy + size * 0.16); ctx.scale(0.82, 1.15);
      ctx.beginPath(); ctx.arc(0, 0, size * 0.165, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = flash ? '#111' : '#8fffb0';
      ctx.save(); ctx.translate(cx, cy + size * 0.13); ctx.scale(1.5, 0.85);
      ctx.beginPath(); ctx.arc(0, 0, size * 0.075, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = flash ? '#fff' : '#0a2a12';
      ctx.beginPath(); ctx.arc(cx, cy + size * 0.13, size * 0.03, 0, Math.PI * 2); ctx.fill();
    } else if (species === 'predator') {
      // broad masked head block + forward-jutting mandibles + dreadlocks
      ctx.fillStyle = flash ? '#ffffff' : headColor;
      roundRect(cx - size * 0.2, cy - size * 0.01, size * 0.4, size * 0.22, size * 0.05); ctx.fill();
      ctx.fillStyle = flash ? '#111' : shadeHex(headColor, -50);
      ctx.beginPath(); ctx.moveTo(cx - size * 0.11, cy + size * 0.2); ctx.lineTo(cx - size * 0.15, cy + size * 0.3); ctx.lineTo(cx - size * 0.04, cy + size * 0.22); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + size * 0.11, cy + size * 0.2); ctx.lineTo(cx + size * 0.15, cy + size * 0.3); ctx.lineTo(cx + size * 0.04, cy + size * 0.22); ctx.fill();
      ctx.strokeStyle = flash ? '#fff' : shadeHex(headColor, -30); ctx.lineWidth = Math.max(1, size * 0.02);
      ctx.beginPath(); ctx.moveTo(cx - size * 0.13, cy + size * 0.18); ctx.lineTo(cx - size * 0.15, cy + size * 0.42); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - size * 0.04, cy + size * 0.2); ctx.lineTo(cx - size * 0.05, cy + size * 0.44); ctx.stroke();
      ctx.fillStyle = '#ffcc33';
      ctx.beginPath(); ctx.arc(cx - size * 0.06, cy + size * 0.09, size * 0.025, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size * 0.06, cy + size * 0.09, size * 0.025, 0, Math.PI * 2); ctx.fill();
    } else if (species === 'frost') {
      // pale round head + ice-spike crown + pulsing glow eye
      ctx.fillStyle = flash ? '#ffffff' : headColor;
      ctx.beginPath(); ctx.arc(cx, cy + size * 0.17, size * 0.165, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = flash ? '#ffffff' : '#eafcff';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(cx + i * size * 0.09, cy - size * 0.02); ctx.lineTo(cx + i * size * 0.09 - size * 0.03, cy + size * 0.08); ctx.lineTo(cx + i * size * 0.09 + size * 0.03, cy + size * 0.08); ctx.fill();
      }

      ctx.fillStyle = 'rgba(150,240,255,' + (0.5 + 0.4 * pulse) + ')';
      ctx.beginPath(); ctx.arc(cx, cy + size * 0.16, size * 0.045, 0, Math.PI * 2); ctx.fill();
    } else if (species === 'cop') {
      // human head + peaked cap
      ctx.fillStyle = flash ? '#ffffff' : headColor;
      ctx.beginPath(); ctx.arc(cx, cy + size * 0.18, size * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : '#dddddd';
      ctx.beginPath(); ctx.moveTo(cx - size * 0.16, cy + size * 0.04); ctx.lineTo(cx + size * 0.16, cy + size * 0.04); ctx.lineTo(cx + size * 0.09, cy - size * 0.06); ctx.lineTo(cx - size * 0.09, cy - size * 0.06); ctx.fill();
      ctx.fillRect(cx - size * 0.19, cy + size * 0.02, size * 0.38, size * 0.03);
      ctx.fillStyle = '#ffee55';
      ctx.beginPath(); ctx.arc(cx - size * 0.05, cy + size * 0.17, size * 0.025, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size * 0.05, cy + size * 0.17, size * 0.025, 0, Math.PI * 2); ctx.fill();
    } else if (species === 'fungoid') {
      // mushroom-cap head with faint spore dots
      ctx.fillStyle = flash ? '#ffffff' : headColor;
      ctx.beginPath(); ctx.arc(cx, cy + size * 0.14, size * 0.19, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillRect(cx - size * 0.19, cy + size * 0.14, size * 0.38, size * 0.08);
      ctx.fillStyle = flash ? '#eee' : 'rgba(220,255,180,0.85)';
      ctx.beginPath(); ctx.arc(cx - size * 0.08, cy + size * 0.06, size * 0.02, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size * 0.05, cy + size * 0.03, size * 0.018, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(cx, cy + size * 0.2, size * 0.028, 0, Math.PI * 2); ctx.fill();
    } else if (species === 'cyborg') {
      // blocky robotic head + red visor strip
      ctx.fillStyle = flash ? '#ffffff' : headColor;
      ctx.fillRect(cx - size * 0.15, cy - size * 0.02, size * 0.3, size * 0.2);
      ctx.fillStyle = flash ? '#fff' : '#ff3333';
      ctx.fillRect(cx - size * 0.11, cy + size * 0.06, size * 0.22, size * 0.03);
    } else if (species === 'clown') {
      // round head, red nose, colorful hair tuft
      ctx.fillStyle = flash ? '#ffffff' : headColor;
      ctx.beginPath(); ctx.arc(cx, cy + size * 0.17, size * 0.17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : shadeHex(headColor, 40);
      ctx.beginPath(); ctx.moveTo(cx, cy - size * 0.12); ctx.lineTo(cx - size * 0.09, cy + size * 0.01); ctx.lineTo(cx + size * 0.09, cy + size * 0.01); ctx.fill();
      ctx.fillStyle = '#ff3355';
      ctx.beginPath(); ctx.arc(cx, cy + size * 0.2, size * 0.045, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx - size * 0.06, cy + size * 0.14, size * 0.025, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size * 0.06, cy + size * 0.14, size * 0.025, 0, Math.PI * 2); ctx.fill();
    } else {

      ctx.fillStyle = flash ? '#ffffff' : headColor;

      ctx.fillStyle = '#ffee55';
      ctx.beginPath(); ctx.arc(cx - size * 0.06, cy + size * 0.15, size * 0.03, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size * 0.06, cy + size * 0.15, size * 0.03, 0, Math.PI * 2); ctx.fill();

  function drawDwarfSprite(screenX, topY, size, bodyColor, headColor, walkPhase, flash, alpha) {
    // short and stout: compress vertical scale, widen horizontal scale
    const SY = size * 0.72, SX = size * 1.3;
    const baseY = topY + (size - SY); // keep feet planted at same ground line
    ctx.save();
    ctx.globalAlpha = alpha;
    const legSwing = Math.sin(walkPhase) * SY * 0.14;
    ctx.fillStyle = flash ? '#ffffff' : shadeHex(bodyColor, -30);
    const legTopY = baseY + SY * 0.66;
    ctx.fillRect(screenX - SX * 0.16, legTopY + Math.max(0, legSwing), SX * 0.13, SY * 0.34 - Math.max(0, legSwing));
    ctx.fillRect(screenX + SX * 0.03, legTopY + Math.max(0, -legSwing), SX * 0.13, SY * 0.34 - Math.max(0, -legSwing));
    const armSwing = Math.sin(walkPhase + Math.PI) * SY * 0.1;
    ctx.fillStyle = flash ? '#ffffff' : shadeHex(bodyColor, -15);
    ctx.fillRect(screenX - SX * 0.3, baseY + SY * 0.34 + armSwing, SX * 0.1, SY * 0.3);
    ctx.fillRect(screenX + SX * 0.2, baseY + SY * 0.34 - armSwing, SX * 0.1, SY * 0.3);
    ctx.fillStyle = flash ? '#ffffff' : bodyColor;
    roundRect(screenX - SX * 0.22, baseY + SY * 0.28, SX * 0.44, SY * 0.42, SY * 0.08); ctx.fill();
    // small helmet block
    ctx.fillStyle = flash ? '#ffffff' : shadeHex(headColor, -10);
    ctx.fillRect(screenX - SX * 0.15, baseY - size * 0.01, SX * 0.3, SY * 0.09);
    // head
    ctx.fillStyle = flash ? '#ffffff' : headColor;
    ctx.beginPath(); ctx.arc(screenX, baseY + SY * 0.18, SY * 0.17, 0, Math.PI * 2); ctx.fill();
    // wedge beard
    ctx.fillStyle = flash ? '#eeeeee' : '#cfc4a8';
    ctx.beginPath(); ctx.moveTo(screenX - SX * 0.12, baseY + SY * 0.24); ctx.lineTo(screenX + SX * 0.12, baseY + SY * 0.24); ctx.lineTo(screenX, baseY + SY * 0.46); ctx.fill();
    ctx.fillStyle = '#ffee55';
    ctx.beginPath(); ctx.arc(screenX - SX * 0.06, baseY + SY * 0.15, SX * 0.025, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(screenX + SX * 0.06, baseY + SY * 0.15, SX * 0.025, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawHamsterSprite(screenX, topY, size, bodyColor, headColor, walkPhase, flash, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const bob = Math.sin(walkPhase) * size * 0.03;
    const cy = topY + size * 0.58 + bob;
    // stubby limbs
    ctx.fillStyle = flash ? '#ffffff' : shadeHex(bodyColor, -25);
    ctx.beginPath(); ctx.ellipse(screenX - size * 0.27, cy + size * 0.26, size * 0.09, size * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(screenX + size * 0.27, cy + size * 0.26, size * 0.09, size * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    // wide oval body
    ctx.fillStyle = flash ? '#ffffff' : bodyColor;
    ctx.beginPath(); ctx.ellipse(screenX, cy, size * 0.42, size * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    // round head
    const headY = cy - size * 0.32;
    ctx.beginPath(); ctx.ellipse(screenX, headY, size * 0.26, size * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    // ears
    ctx.fillStyle = flash ? '#ffffff' : shadeHex(bodyColor, -15);
    ctx.beginPath(); ctx.arc(screenX - size * 0.18, headY - size * 0.17, size * 0.09, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(screenX + size * 0.18, headY - size * 0.17, size * 0.09, 0, Math.PI * 2); ctx.fill();
    // pink cheeks
    ctx.fillStyle = flash ? '#ffdddd' : '#ffb3c1';
    ctx.beginPath(); ctx.arc(screenX - size * 0.16, headY + size * 0.07, size * 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(screenX + size * 0.16, headY + size * 0.07, size * 0.06, 0, Math.PI * 2); ctx.fill();
    // eyes
    ctx.fillStyle = '#221100';
    ctx.beginPath(); ctx.arc(screenX - size * 0.08, headY, size * 0.035, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(screenX + size * 0.08, headY, size * 0.035, 0, Math.PI * 2); ctx.fill();
    // nose
    ctx.fillStyle = '#663322';
    ctx.beginPath(); ctx.arc(screenX, headY + size * 0.08, size * 0.02, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawCrateSprite(screenX, topY, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const boxW = size * 0.56, boxH = size * 0.58;
    const boxTop = topY + size * 0.42;
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(screenX - boxW / 2, boxTop, boxW, boxH);
    ctx.strokeStyle = '#4a2e14'; ctx.lineWidth = Math.max(1, size * 0.02);
    ctx.strokeRect(screenX - boxW / 2, boxTop, boxW, boxH);
    ctx.beginPath();
    ctx.moveTo(screenX - boxW / 2, boxTop + boxH * 0.5); ctx.lineTo(screenX + boxW / 2, boxTop + boxH * 0.5);
    ctx.moveTo(screenX, boxTop); ctx.lineTo(screenX, boxTop + boxH);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,215,90,' + (0.4 + 0.5 * pulse) + ')';
    ctx.lineWidth = Math.max(1.5, size * 0.045);
    ctx.strokeRect(screenX - boxW / 2 - 2, boxTop - 2, boxW + 4, boxH + 4);
    ctx.fillStyle = 'rgba(255,240,140,' + (0.7 + 0.3 * pulse) + ')';
    ctx.font = 'bold ' + Math.round(size * 0.34) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('\u2605', screenX, boxTop - size * 0.08);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  function renderCharacters() {
    const items = [];
    for (const e of enemies) {
      if (!e.alive) continue;
      items.push({ x: e.x, y: e.y, body: e.kind.color, head: e.kind.dark, radius: e.kind.radius, animT: e.animT || 0, hitT: e.hitT, hp: e.hp, maxHp: e.maxHp, species: e.kind.species, type: 'humanoid' });
    }
    for (const n of npcs) {
      items.push({ x: n.x, y: n.y, body: NPC_KIND.color, head: NPC_KIND.dark, radius: NPC_KIND.radius, animT: n.animT || 0, hitT: 0, hp: null, maxHp: null, species: null, type: 'humanoid' });
    }
    if (artifactCrate && !artifactCrate.opened) {
      items.push({ x: artifactCrate.x, y: artifactCrate.y, radius: 0.3, type: 'crate' });
    }
    const sorted = items.map(o => {
      const dx = o.x - player.x, dy = o.y - player.y;
      const dist = Math.hypot(dx, dy);
      const angTo = normAngle(Math.atan2(dy, dx) - player.angle);
      return { o, dist, angTo };
    }).filter(s => Math.abs(s.angTo) < FOV / 2 + 0.3 && s.dist < MAX_DEPTH)
      .sort((a, b) => b.dist - a.dist);

    for (const s of sorted) {
      const screenX = (0.5 + s.angTo / FOV) * RW;
      const col = Math.max(0, Math.min(NUM_RAYS - 1, Math.floor(screenX)));
      if (s.dist > lastWallDist[col] + 0.15) continue; // occluded
      const size = Math.min(RH * 1.4, (RH / s.dist) * s.o.radius * 2.6);
      const groundY = HALF_H + (RH / s.dist) * 0.42;
      const topY = groundY - size;
      const alpha = Math.max(0.15, Math.min(1, 1 - s.dist / MAX_DEPTH));
      if (s.o.type === 'crate') {
        drawCrateSprite(screenX, topY, size, alpha);
        continue;
      }
      if (s.o.species === 'dwarf') {
        drawDwarfSprite(screenX, topY, size, s.o.body, s.o.head, s.o.animT, s.o.hitT > 0, alpha);
      } else if (s.o.species === 'hamster') {
        drawHamsterSprite(screenX, topY, size, s.o.body, s.o.head, s.o.animT, s.o.hitT > 0, alpha);
      } else if (s.o.species === 'alien' && alienSpriteLoaded) {
        const spW = size * ALIEN_SPRITE_ASPECT;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.drawImage(alienSpriteImg, screenX - spW / 2, topY, spW, size);
        if (s.o.hitT > 0) {
          ctx.globalCompositeOperation = 'source-atop';
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fillRect(screenX - spW / 2, topY, spW, size);
          ctx.globalCompositeOperation = 'source-over';
        }
        ctx.restore();
      } else if (s.o.species === 'predator' && predatorSpriteLoaded) {
        const spW = size * PREDATOR_SPRITE_ASPECT;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.drawImage(predatorSpriteImg, screenX - spW / 2, topY, spW, size);
        if (s.o.hitT > 0) {
          ctx.globalCompositeOperation = 'source-atop';
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fillRect(screenX - spW / 2, topY, spW, size);

  // ---------- bonus mission: tank chase (pseudo-3D driving) ----------
  function startRacing() {
    state = 'racing';
    rcLaneF = 0; rcTargetLane = 1; rcSteerCooldown = 0;
    rcObstacles = [];
    rcHp = 100; rcMaxHp = 100;
    rcScore = 0; rcDistance = 0; rcSpeed = 0.3;
    rcFireCooldown = 0; rcMuzzle = 0; rcDmgFlash = 0;
    rcSpawnTimer = 0.6;
  }
  function rcProject(z, laneF) {
    const t = Math.max(0.001, Math.min(1, z));
    const scale = 0.06 + 0.94 * Math.pow(t, 2.2);
    const y = HALF_H + (RH - HALF_H) * Math.pow(t, 1.6);
    const laneSpacing = 165 * scale;
    return { x: RW / 2 + laneF * laneSpacing, y, scale };
  }
  function shootRacing() {
    if (state !== 'racing') return;
    if (rcFireCooldown > 0) return;
    rcFireCooldown = 0.22;
    rcMuzzle = 0.1;
    sfxTankShoot();
    let best = null, bestZ = -1;
    for (const o of rcObstacles) {
      if (!o.alive || o.type === 'rock' || o.lane !== rcTargetLane) continue;
      if (o.z < 0.05 || o.z > 0.95) continue;
      if (o.z > bestZ) { bestZ = o.z; best = o; }
    }
    if (best) {
      best.hp -= 1;
      if (best.hp <= 0) { best.alive = false; best.exploding = 0.3; rcScore += best.type === 'barrel' ? 20 : 15; sfxEnemyDeath(); }
      else sfxHit();
    }
  }
  function updateRacing(dt) {
    if (rcFireCooldown > 0) rcFireCooldown -= dt;
    if (rcMuzzle > 0) rcMuzzle -= dt;
    if (rcDmgFlash > 0) rcDmgFlash -= dt;
    let steer = 0;
    if (keys['a'] || keys['arrowleft']) steer -= 1;
    if (keys['d'] || keys['arrowright']) steer += 1;
    if (joyActive) steer += joyDX;
    if (rcSteerCooldown > 0) rcSteerCooldown -= dt;
    if (steer < -0.35 && rcSteerCooldown <= 0) { rcTargetLane = Math.max(0, rcTargetLane - 1); rcSteerCooldown = 0.24; }
    if (steer > 0.35 && rcSteerCooldown <= 0) { rcTargetLane = Math.min(2, rcTargetLane + 1); rcSteerCooldown = 0.24; }
    const targetF = rcTargetLane - 1;
    rcLaneF += (targetF - rcLaneF) * Math.min(1, dt * 8);

    rcSpeed = 0.3 + Math.min(0.5, rcDistance / 900);
    rcDistance += dt * rcSpeed * 60;

    rcSpawnTimer -= dt;
    if (rcSpawnTimer <= 0) {
      rcSpawnTimer = Math.max(0.5, 1.2 - rcDistance / 1500);
      const roll = Math.random();
      const type = roll < 0.4 ? 'police' : roll < 0.72 ? 'barrel' : 'rock';
      rcObstacles.push({ z: 1.05, lane: Math.floor(Math.random() * 3), type, hp: type === 'police' ? 2 : 1, alive: true, exploding: 0 });
    }

    for (const o of rcObstacles) {
      o.z -= dt * rcSpeed;
      if (o.exploding > 0) o.exploding -= dt;
      if (o.alive && o.z < 0.1 && o.z > 0.02 && o.lane === rcTargetLane) {
        o.alive = false; o.exploding = 0.001;
        rcHp -= (o.type === 'rock' ? 24 : o.type === 'police' ? 16 : 12);
        rcDmgFlash = 0.35;
        sfxCrash();
        if (rcHp <= 0) { rcHp = 0; state = 'racinglost'; sfxGameOver(); }
      }
    }
    rcObstacles = rcObstacles.filter(o => o.z > -0.08);

    if (state === 'racing' && rcDistance >= RC_TARGET_DISTANCE) { state = 'racingwin'; sfxVictory(); }
  }
  function drawTankAt(screenX, y, scale, alpha, color, dark) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const w = 78 * scale, h = 46 * scale;
    ctx.fillStyle = dark;
    roundRect(screenX - w * 0.55, y - h * 0.28, w * 1.1, h * 0.5, 4 * scale); ctx.fill();
    ctx.fillStyle = color;
    roundRect(screenX - w * 0.42, y - h * 0.58, w * 0.84, h * 0.42, 6 * scale); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(screenX, y - h * 0.42, w * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(screenX - w * 0.05, y - h * 1.05, w * 0.1, h * 0.5);
    ctx.restore();
  }
  function drawRacing() {
    const sky = ctx.createLinearGradient(0, 0, 0, HALF_H);
    sky.addColorStop(0, '#2a1608'); sky.addColorStop(1, '#7a4018');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, RW, HALF_H);
    const road = ctx.createLinearGradient(0, HALF_H, 0, RH);
    road.addColorStop(0, '#3a3a3a'); road.addColorStop(1, '#121212');
    ctx.fillStyle = road; ctx.fillRect(0, HALF_H, RW, HALF_H);
    // road edges + lane guides converging to horizon
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath();
    const eL = rcProject(0.02, -2.1), fL = rcProject(1, -2.1);
    ctx.moveTo(eL.x, eL.y); ctx.lineTo(RW / 2, HALF_H);
    const eR = rcProject(0.02, 2.1), fR = rcProject(1, 2.1);
    ctx.moveTo(eR.x, eR.y); ctx.lineTo(RW / 2, HALF_H);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,220,80,0.5)';
    for (const lf of [-0.66, 0.66]) {
      ctx.beginPath();
      const dashCount = 8;
      for (let i = 0; i < dashCount; i++) {
        let z = 1 - ((i / dashCount + (rcDistance % 30) / 30) % 1);
        const p = rcProject(z, lf);
        if (i % 2 === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    const sorted = rcObstacles.slice().sort((a, b) => b.z - a.z);
    for (const o of sorted) {
      const laneF = (o.lane - 1);
      const p = rcProject(Math.max(0.02, o.z), laneF);
      const alpha = o.alive ? 1 : Math.max(0, o.exploding * 3);
      if (!o.alive && alpha <= 0) continue;
      const size = 60 * p.scale;
      ctx.save();
      ctx.globalAlpha = Math.min(1, alpha);
      if (o.type === 'rock') {
        ctx.fillStyle = '#6b6258';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - size * 0.7); ctx.lineTo(p.x + size * 0.42, p.y - size * 0.1);
        ctx.lineTo(p.x + size * 0.3, p.y + size * 0.25); ctx.lineTo(p.x - size * 0.3, p.y + size * 0.25);
        ctx.lineTo(p.x - size * 0.42, p.y - size * 0.1); ctx.closePath(); ctx.fill();
      } else if (o.type === 'barrel') {
        ctx.fillStyle = o.alive ? '#d67a1e' : '#ff9933';
        roundRect(p.x - size * 0.22, p.y - size * 0.55, size * 0.44, size * 0.55, size * 0.08); ctx.fill();
        ctx.fillStyle = '#3a2308'; ctx.fillRect(p.x - size * 0.22, p.y - size * 0.32, size * 0.44, size * 0.06);
      } else { // police
        ctx.fillStyle = '#1c2a4a';
        roundRect(p.x - size * 0.36, p.y - size * 0.42, size * 0.72, size * 0.42, size * 0.08); ctx.fill();
        ctx.fillStyle = '#e8e8e8';
        ctx.fillRect(p.x - size * 0.3, p.y - size * 0.3, size * 0.6, size * 0.12);
        ctx.fillStyle = Math.floor(performance.now() / 150) % 2 === 0 ? '#ff2222' : '#2244ff';
        ctx.beginPath(); ctx.arc(p.x, p.y - size * 0.46, size * 0.07, 0, Math.PI * 2); ctx.fill();
      }
      if (!o.alive && o.exploding > 0) {
        ctx.fillStyle = 'rgba(255,180,60,' + Math.min(1, o.exploding * 2) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y - size * 0.3, size * 0.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // player tank
    const pp = rcProject(0.06, rcLaneF);
    drawTankAt(RW / 2 + rcLaneF * 46, RH - 34, 1.5, 1, '#5a6b3a', '#2e3a1e');
    if (rcMuzzle > 0) {
      ctx.fillStyle = 'rgba(255,220,120,' + Math.min(1, rcMuzzle * 8) + ')';
      ctx.beginPath(); ctx.arc(RW / 2 + rcLaneF * 46, RH - 34 - 70, 16, 0, Math.PI * 2); ctx.fill();
    }

    // HUD
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, RW, 30);
    ctx.fillStyle = '#333'; ctx.fillRect(10, 9, 120, 12);
    const pct = Math.max(0, rcHp / rcMaxHp);
    ctx.fillStyle = pct > 0.5 ? '#4CAF50' : pct > 0.25 ? '#ffaa00' : '#ff3333';
    ctx.fillRect(10, 9, 120 * pct, 12);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(10, 9, 120, 12);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left';
    ctx.fillText('БРОНЯ', 14, 19);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffcc33';
    ctx.fillText('ТАНКОВАЯ ПОГОНЯ', RW - 10, 13);
    ctx.fillStyle = '#fff';
    ctx.fillText('ОЧКИ ' + rcScore + '   ' + Math.min(100, Math.floor(rcDistance / RC_TARGET_DISTANCE * 100)) + '%', RW - 10, 26);
    ctx.textAlign = 'left';
    if (rcDmgFlash > 0) {
      ctx.fillStyle = 'rgba(255,0,0,' + Math.min(0.45, rcDmgFlash) + ')';
      ctx.fillRect(0, 0, RW, RH);
    }
    // crosshair (lane-locked)
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5;
    const cx = RW / 2 + rcLaneF * 46, cy = HALF_H + 30;
    ctx.beginPath(); ctx.moveTo(cx - 8, cy); ctx.lineTo(cx - 3, cy); ctx.moveTo(cx + 3, cy); ctx.lineTo(cx + 8, cy);
    ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy - 3); ctx.moveTo(cx, cy + 3); ctx.lineTo(cx, cy + 8);
    ctx.stroke();
  }
  function drawRacingWin() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, RW, RH);
    centeredText('ПОГОНЯ ЗАВЕРШЕНА', RH * 0.32, 24, '#4CAF50');
    centeredText('ОЧКИ ГОНКИ: ' + rcScore, RH * 0.32 + 34, 18, '#fff');
    centeredText('ОБЩИЙ СЧЁТ: ' + (score + rcScore), RH * 0.32 + 58, 15, '#ffaa00', 'normal');
    centeredText('Нажми, чтобы начать заново', RH * 0.32 + 90, 13, '#ccc', 'normal');
  }
  function drawRacingLost() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, RW, RH);
    centeredText('ТАНК УНИЧТОЖЕН', RH * 0.32, 26, '#ff3300');
    centeredText('ОЧКИ ГОНКИ: ' + rcScore, RH * 0.32 + 34, 16, '#fff');
    centeredText('Нажми, чтобы начать заново', RH * 0.32 + 64, 13, '#ccc', 'normal');
  }

  function draw() {
    if (state === 'menu') { drawMenu(); return; }
    if (state === 'victory') { drawVictory(); return; }
    if (state === 'paywall') { drawPaywall(); return; }
    if (state === 'racing' || state === 'racingwin' || state === 'racinglost') {
      drawRacing();
      if (state === 'racingwin') drawRacingWin();
      if (state === 'racinglost') drawRacingLost();
      return;
    }
    renderScene();
    renderCharacters();
    renderGun();
    renderPlayerLegs();
    renderHUD();
    if (state === 'wavebreak') drawWaveBreak();
    if (state === 'stageclear') drawStageClear();
    if (state === 'gameover') drawGameOver();
    if (state === 'paused') drawPause();
  }

  // ---------- input ----------
  const keys = {};
  let moving = false;
  document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ') { e.preventDefault(); handleTap(); }
    if ((e.key === 'p' || e.key === 'Escape') && state === 'playing') state = 'paused';
    else if ((e.key === 'p' || e.key === 'Escape') && state === 'paused') state = 'playing';
  });
  document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  let joyActive = false, joyDX = 0, joyDY = 0;
  const joyZone = document.getElementById('joyZone');
  const joyThumb = document.getElementById('joyThumb');
  function joySet(clientX, clientY) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    let dx = clientX - cx, dy = clientY - cy;
    const max = rect.width / 2;
    const dist = Math.hypot(dx, dy);
    if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
    joyDX = dx / max; joyDY = dy / max;
    joyThumb.style.left = (35 + dx * 0.6) + 'px';
    joyThumb.style.top = (35 + dy * 0.6) + 'px';
  }
  function joyReset() {
    joyActive = false; joyDX = 0; joyDY = 0;
    joyThumb.style.left = '35px'; joyThumb.style.top = '35px';
  }
  joyZone.addEventListener('touchstart', e => { e.preventDefault(); joyActive = true; const t = e.changedTouches[0]; joySet(t.clientX, t.clientY); }, { passive: false });
  joyZone.addEventListener('touchmove', e => { e.preventDefault(); if (!joyActive) return; const t = e.changedTouches[0]; joySet(t.clientX, t.clientY); }, { passive: false });
  joyZone.addEventListener('touchend', e => { e.preventDefault(); joyReset(); }, { passive: false });
  joyZone.addEventListener('mousedown', e => { joyActive = true; joySet(e.clientX, e.clientY); });
  document.addEventListener('mousemove', e => { if (joyActive) joySet(e.clientX, e.clientY); });
  document.addEventListener('mouseup', () => { if (joyActive) joyReset(); });

  const fireBtn = document.getElementById('fireBtn');
  function handleTap(tx, ty) {
    unlockAudio();
    if (state === 'menu') {
      if (typeof tx === 'number' && typeof ty === 'number') {
        for (let wi = 0; wi < WEAPON_ORDER.length; wi++) {
          const wk = WEAPON_ORDER[wi];
          if (buttonsHit(tx, ty, buttons['weapon_' + wk])) {
            sfxUiBeep(); currentWeapon = wk;
            try { localStorage.setItem('ar_weapon', wk); } catch (e) {}
            return;
          }
        }
        if (buttonsHit(tx, ty, buttons.start)) { sfxUiBeep(); startGame(); return; }
        return;
      }
      sfxUiBeep(); startGame(); return;
    }
    if (state === 'gameover') { sfxUiBeep(); startGame(); return; }
    if (state === 'wavebreak' || state === 'stageclear') return;
    if (state === 'paused') { sfxUiBeep(); state = 'playing'; return; }
    if (state === 'paywall') { payForFinalMission(); return; }
    if (state === 'victory') { sfxUiBeep(); startRacing(); return; }
    if (state === 'racing') { shootRacing(); return; }
    if (state === 'racingwin' || state === 'racinglost') { sfxUiBeep(); startGame(); return; }
    if (state === 'playing') shoot();
  }
  function handleFireTap(e) {
    e.preventDefault();
    handleTap();
  }
  fireBtn.addEventListener('touchstart', handleFireTap, { passive: false });
  fireBtn.addEventListener('mousedown', handleFireTap);

  function canvasTapXY(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return { x: -1, y: -1 };
    return { x: (clientX - rect.left) / rect.width * RW, y: (clientY - rect.top) / rect.height * RH };
  }
  canvas.addEventListener('click', (e) => { const p = canvasTapXY(e.clientX, e.clientY); handleTap(p.x, p.y); });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    const p = t ? canvasTapXY(t.clientX, t.clientY) : { x: -1, y: -1 };
    handleTap(p.x, p.y);
  }, { passive: false });

  const buttonsHit = (x, y, b) => b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

  function shoot() {
    if (state !== 'playing') return;
    if (fireCooldown > 0) return;
    const wp = WEAPONS[currentWeapon];
    fireCooldown = wp.cooldown;
    muzzleFlash = 0.12;
    sfxShoot();
    const pelletCount = wp.pellets || 1;
    for (let pi = 0; pi < pelletCount; pi++) {
      const pelletAngle = pelletCount > 1 ? player.angle + (Math.random() - 0.5) * wp.spreadRad : player.angle;
      const wallDist = castRay(pelletAngle).dist;
      let best = null, bestDist = Infinity, bestIsCrate = false;
      for (const e of enemies) {
        if (!e.alive) continue;
        const dx = e.x - player.x, dy = e.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist > wallDist) continue;
        const angTo = Math.atan2(dy, dx);
        const diff = Math.abs(normAngle(angTo - pelletAngle));
        const angularSize = Math.max(0.065, Math.atan2(e.kind.radius, dist));
        if (diff < angularSize + 0.055) {
          if (dist < bestDist) { bestDist = dist; best = e; bestIsCrate = false; }
        }
      }
      if (artifactCrate && !artifactCrate.opened) {
        const dx = artifactCrate.x - player.x, dy = artifactCrate.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist <= wallDist) {
          const angTo = Math.atan2(dy, dx);
          const diff = Math.abs(normAngle(angTo - pelletAngle));
          const angularSize = Math.max(0.065, Math.atan2(0.3, dist));
          if (diff < angularSize + 0.055 && dist < bestDist) {
            bestDist = dist; best = artifactCrate; bestIsCrate = true;
          }
        }
      }
      if (best) {
        if (bestIsCrate) {
          artifactCrate.opened = true;
          score += 150;
          sfxArtifact();
          completeStage();
        } else {
          best.hp -= wp.dmg; best.hitT = 0.15;
          if (best.hp <= 0) {
            best.alive = false;
            score += best.kind.boss ? 220 : 15;
            kills++;
            sfxEnemyDeath();
          } else {
            score += 3; sfxHit();
          }
        }
      }
    }
  }

  function completeStage() {
    if (stageIndex >= STAGES.length - 1) {
      state = 'victory';
      sfxVictory();
      recordLeaderboardEntry();
    } else if (stageIndex === STAGES.length - 2 && !finalUnlocked) {
      state = 'paywall';
      sfxUiBeep();
    } else {
      state = 'stageclear';
      sfxStageClear();
    }
  }

  // ---------- update ----------
  function update(dt) {
    if (fireCooldown > 0) fireCooldown -= dt;
    if (muzzleFlash > 0) muzzleFlash -= dt;
    if (dmgFlash > 0) dmgFlash -= dt;

    if (state === 'wavebreak') {
      waveTimer += dt;
      if (waveTimer > 2) startWave();
      return;
    }
    if (state === 'stageclear') {
      waveTimer += dt;
      if (waveTimer > 3) advanceStage();
      return;
    }
    if (state === 'racing') { updateRacing(dt); return; }
    if (state !== 'playing') return;

    for (const n of npcs) {
      n.animT += dt * n.speed * 2.4;
      n.wanderT -= dt;
      if (n.wanderT <= 0) { n.angle = Math.random() * Math.PI * 2; n.wanderT = 1.5 + Math.random() * 2.5; }
      const nx = n.x + Math.cos(n.angle) * n.speed * dt;
      const ny = n.y + Math.sin(n.angle) * n.speed * dt;
      if (!isWall(nx, n.y)) n.x = nx; else n.angle = Math.random() * Math.PI * 2;
      if (!isWall(n.x, ny)) n.y = ny; else n.angle = Math.random() * Math.PI * 2;
    }

    let turn = 0, fwd = 0, strafe = 0;
    if (keys['a'] || keys['arrowleft']) turn -= 1;
    if (keys['d'] || keys['arrowright']) turn += 1;
    if (keys['w'] || keys['arrowup']) fwd += 1;
    if (keys['s'] || keys['arrowdown']) fwd -= 1;
    if (joyActive) { turn += joyDX; fwd -= joyDY; }
    turn = Math.max(-1, Math.min(1, turn));
    fwd = Math.max(-1, Math.min(1, fwd));

    moving = Math.abs(fwd) > 0.05;
    if (moving) playerWalkPhase += dt * 9;
    player.angle += turn * player.turnSpeed * dt;

    const mx = Math.cos(player.angle) * fwd * player.speed * dt;
    const my = Math.sin(player.angle) * fwd * player.speed * dt;
    const r = 0.22;
    if (!isWall(player.x + mx + Math.sign(mx) * r, player.y)) player.x += mx;
    if (!isWall(player.x, player.y + my + Math.sign(my) * r)) player.y += my;

    let aliveCount = 0;
    for (const e of enemies) {
      if (!e.alive) continue;
      aliveCount++;
      if (e.hitT > 0) e.hitT -= dt;
      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.hypot(dx, dy);
      const atkRange = e.kind.radius + 0.35;
      if (dist > atkRange) {
        const nx = dx / dist, ny = dy / dist;
        const speed = e.kind.speed * dt;
        const tx = e.x + nx * speed, ty = e.y + ny * speed;
        if (!isWall(tx, e.y)) e.x = tx;
        if (!isWall(e.x, ty)) e.y = ty;
        e.animT = (e.animT || 0) + dt * e.kind.speed * 2.6;
      } else {
        e.attackT = (e.attackT || 0) - dt;
        if (e.attackT <= 0) {
          e.attackT = 1.3;
          player.hp -= e.kind.dmg;
          dmgFlash = 0.35;
          sfxPlayerHurt();
          if (player.hp <= 0) { player.hp = 0; gameOver(); return; }
        }
      }
    }
    if (aliveCount === 0) {
      wavesInStage++;
      waveTimer = 0;
      player.hp = Math.min(player.maxHp, player.hp + 15);
      if (wavesInStage >= WAVES_PER_STAGE) {
        completeStage();
      } else {
        state = 'wavebreak';
        sfxWaveClear();
      }
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
